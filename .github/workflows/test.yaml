name: Test

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
          - "3.14"
          - "3.13"
          - "3.12"
          - "3.11"
          - "3.10"
          - "3.9"
          - "3.8"
      fail-fast: false
    steps:
      - uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --all-extras --dev --python ${{ matrix.python-version }}
      - name: Run Ruff check
        run: uv run ruff check src
      - name: Run Ruff format
        run: uv run ruff format --check src
      - name: Run Mypy
        run: uv run mypy src
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
          - "3.14"
          - "3.13"
          - "3.12"
          - "3.11"
          - "3.10"
          - "3.9"
          - "3.8"
      fail-fast: false
    steps:
      - uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --all-extras --dev --python ${{ matrix.python-version }}
      - name: Run pytest
        run: |
          set -o pipefail
          uv run pytest --junitxml=pytest.xml --cov-report=term-missing --cov=src tests/ | tee pytest-coverage.txt
      - name: Upload coverage artifact
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: pytest-coverage-${{ matrix.python-version }}
          path: |
            pytest-coverage.txt
            pytest.xml
          retention-days: 1
  coverage-comment:
    needs: test
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    permissions:
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Download coverage artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: pytest-coverage-*
          path: coverage-artifacts
      - name: Build multiple-files input
        id: build-list
        run: |
          {
            echo "multiple-files<<EOF"
            for dir in $(find coverage-artifacts -maxdepth 1 -type d -name 'pytest-coverage-*' -printf '%p/\n' | sort -V); do
              version="$(basename "$dir" | sed 's/^pytest-coverage-//')"
              echo "Python ${version}, ${dir}pytest-coverage.txt, ${dir}pytest.xml"
            done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Comment coverage report in PR
        uses: MishaKav/pytest-coverage-comment@v1.12.2
        with:
          multiple-files: ${{ steps.build-list.outputs.multiple-files }}
