name: Update CONTRIBUTORS.md

on:
  schedule:
    - cron: '0 2 * * *' # Runs every day at 2am UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    permissions:
      contents: write
      pull-requests: write

    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Setup jq
      uses: dcarbone/install-jq-action@v4

    - name: Update CONTRIBUTORS.md
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail

        tmp="$(mktemp)"
        page=1
        while :; do
          response="$(curl -sf \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/mapiv/pypcd4/contributors?page=${page}&per_page=100")"
          count="$(jq 'length' <<<"$response")"
          [ "$count" -eq 0 ] && break
          jq -r '.[] | "* [" + .login + "](" + .html_url + ")"' <<<"$response" >>"$tmp"
          page=$((page + 1))
        done

        {
          echo "# Contributors"
          echo
          sort -f "$tmp"
        } | tee CONTRIBUTORS.md

    - name: Create Pull Request
      uses: peter-evans/create-pull-request@v8
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        commit-message: Update CONTRIBUTORS.md
        title: Update CONTRIBUTORS.md
        body: |
          This PR updates the list of contributors in CONTRIBUTORS.md.
          This PR is automatically generated by [create-pull-request](https://github.com/peter-evans/create-pull-request) GitHub Actions.
        branch: update-contributors
        add-paths: |
          CONTRIBUTORS.md
        labels: |
          rd/chore
